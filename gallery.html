<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>겨울 동네 장식 소품</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic:wght@400;700;800&family=Song+Myung&family=Do+Hyeon&family=Jua&family=Gugi&family=Yeon+Sung&family=Gaegu:wght@700&family=Sunflower:wght@500;700&family=Nanum+Myeongjo:wght@700;800&family=Gothic+A1:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: 왼쪽 소품 목록, 오른쪽 3D 진열장, 아래 정보 카드 */
  --ink:#2b3f55; --ink-soft:#5d7088; --teal:#2f7f8c; --brick:#b5594a;
  --snow:#f3f7fa; --line:#cdd9e3; --panel:rgba(243,247,250,.94);
  --display:"Do Hyeon","Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#dde7ee;color:var(--ink);font-family:var(--body);display:grid;grid-template-columns:270px 1fr;overflow:hidden}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px;overflow:auto}
h1{font-family:var(--display);font-weight:400;font-size:26px;margin:0;text-wrap:balance}
.sub{color:var(--ink-soft);font-size:14px;margin:4px 0 18px;line-height:1.5}
h2{font-family:var(--display);font-weight:400;font-size:15px;color:var(--ink-soft);margin:18px 0 8px}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;font:inherit;color:inherit;
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
.item:hover{border-color:var(--teal)}
.item[aria-current="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
.cat{font-family:var(--body);font-weight:400;font-size:12px;color:var(--ink-soft);margin:10px 2px 5px;letter-spacing:.02em}
.legend{font-size:12px;color:var(--ink-soft);margin:-8px 0 12px;line-height:1.9}
details.sec{border-top:1px solid var(--line);padding:4px 0 8px}
details.sec summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:10px 2px 4px;font-family:var(--display);font-size:17px;color:var(--ink)}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::after{content:'+';font-family:var(--body);font-size:18px;color:var(--ink-soft)}
details.sec[open] summary::after{content:'−'}
details.sec summary small{font-family:var(--body);font-size:12px;color:var(--ink-soft);margin-left:6px;font-weight:400}
details.sec .note{font-size:12px;color:var(--ink-soft);margin:0 2px 4px;line-height:1.5}
.item .note{display:block;font-size:11px;opacity:.75;margin-top:2px}
.item .txt{min-width:0}
.badge.idle{background:#e3e8ec;color:var(--ink-soft)} .badge.old{background:#ece3e3;color:#8a5a5a}
.badge{font-size:11px;border-radius:999px;padding:2px 7px;background:#f4e3c6;color:var(--brick);white-space:nowrap}
.item[aria-current="true"] .badge{background:rgba(255,255,255,.22);color:#fff}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
main{position:relative;min-width:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas:active{cursor:grabbing}
.card{position:absolute;left:16px;bottom:16px;width:min(460px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:14px 16px;box-shadow:0 6px 20px rgba(43,63,85,.12)}
.card h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fold{flex:none;display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:34px}
.fold:hover{border-color:var(--teal)}
.fold svg{width:12px;height:12px;transition:transform .2s}
.card[data-open="false"] .fold svg{transform:rotate(180deg)}
.card-body{margin-top:4px}
.card[data-open="false"]{width:auto;max-width:calc(100% - 32px);padding:8px 8px 8px 16px}
.card[data-open="false"] .card-body{display:none}
.card[data-open="false"] h3{font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.meta span{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums}
.code{display:flex;gap:8px;align-items:stretch}
code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;font-size:13px;background:#26333f;color:#e8eef3;border-radius:8px;padding:9px 11px;font-family:ui-monospace,Menlo,Consolas,monospace}
.copy{font:inherit;font-size:13px;border:0;border-radius:8px;background:var(--teal);color:#fff;padding:0 14px;cursor:pointer}
.hint{position:absolute;right:16px;top:16px;font-size:13px;color:var(--ink-soft);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px}
@media (max-width:720px){
  .legend{display:none}
  body{grid-template-columns:1fr;grid-template-rows:1fr auto}
  aside{grid-row:2;border-right:0;border-top:1px solid var(--line);padding:10px 12px;max-height:38vh}
  h1{font-size:20px} .sub{display:none}
  .card{bottom:10px;left:10px;width:calc(100% - 20px)} .card[data-open="false"]{max-width:calc(100% - 20px)} .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<aside>
  <h1>겨울 동네 장식 소품</h1>
  <p class="sub">맵에 놓을 수 있는 건물과 소품 모음입니다. 고르면 그쪽으로 카메라가 이동합니다.</p>
  <p class="legend"><span class="badge">새 소품</span> 아직 맵에 없음 · 나머지는 모두 맵에 놓인 소품 (아파트 단지 · 공원 · 학교 · 간이역 · 기타)</p>
  <div id="lists"></div>
</aside>
<main>
  <canvas id="view" tabindex="0" aria-label="소품 3D 미리보기"></canvas>
  <div class="hint">끌어서 돌리기 · 휠로 확대</div>
  <section class="card" id="card" data-open="true">
    <div class="card-head">
      <h3 id="name" aria-live="polite"></h3>
      <button class="fold" id="fold" type="button" aria-expanded="true" aria-controls="card-body">
        <span id="fold-label">접기</span>
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4.5 6 8.5 10 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="card-body" id="card-body">
      <div class="meta" id="meta"></div>
      <div class="code"><code id="code"></code><button class="copy" id="copy">복사</button></div>
    </div>
  </section>
</main>
<script type="module">
import * as THREE from './src/lib/three.js';
import { propNames, getProp, buildProp } from './src/props/registry.js';
import { pillSprite } from './src/core/gfx.js';
import { setupRenderer, makeLights, makeEnvironment } from './src/core/look.js';
import { CATALOG, STATUS } from './src/props/catalog.js';
import { FONTS_TO_LOAD } from './src/config.js';

await import('./src/props/basic.js');
const oldNames = new Set(propNames());
await import('./src/props/parkBench.js');
await import('./src/props/snowmanCoop.js');
await import('./src/props/kite.js');
await import('./src/props/parkFountain.js');
await import('./src/props/goguma.js');
await import('./src/props/cars.js');
await import('./src/props/aptSite.js');
await import('./src/props/aptYard.js');
await import('./src/props/aptStreet.js');
const decorNames = new Set(propNames());
await import('./src/props/aptTower.js');
await import('./src/props/aptCenter.js');
await import('./src/props/shops.js');
await import('./src/props/bus.js');
await import('./src/props/railway.js');
await import('./src/props/street.js');
await import('./src/props/stationery.js');
await import('./src/props/shopTowers.js');
await import('./src/props/bigShops.js');
await import('./src/props/smallGoods.js');
await import('./src/props/aptBike.js');
await import('./src/props/utilityPole.js');
const names = propNames(), isNew = n => !oldNames.has(n), isBld = n => !decorNames.has(n) && !getProp(n).small;

// 간판 글씨는 처음 한 번 그림으로 굽기 때문에, 글꼴을 다 받은 뒤에 소품을 만든다 (최대 2.5초 기다림)
try { await Promise.race([Promise.all(FONTS_TO_LOAD.map(f => document.fonts.load(f, '동화가'))), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
setupRenderer(renderer);
// 게임과 같은 맑은 겨울 낮 조명
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xbcdaf2); scene.fog = new THREE.Fog(0xbcdaf2, 220, 520);
const camera = new THREE.PerspectiveCamera(45, 1, .1, 500);
const L = makeLights(), sun = L.sun; scene.add(L.hemi, L.amb); sun.castShadow = true;
scene.environment = makeEnvironment(renderer, new THREE.Vector3(-42, 47, 45)); sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, {left:-95, right:95, top:95, bottom:-95, near:1, far:260}); sun.shadow.bias = -.0006; sun.shadow.normalBias = .1;
scene.add(sun, sun.target);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600), new THREE.MeshLambertMaterial({color:0xf1f5f8})); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// 진열 순서는 목록표(src/props/catalog.js)를 따른다. 표에 없는 소품은 맨 끝 '기타'로 간다.
// 작은 소품은 분류마다 새 줄에서 시작해 옆자리끼리 같은 분류가 되고, 건물과 아주 긴 소품은 맨 뒤 줄에 따로 세운다.
// 소품에 variants(모양·색 목록)가 있으면 모양마다 하나씩 진열한다.
const fmt = o => Object.entries(o).map(([k, v]) => k + ': ' + (typeof v === 'number' && v > 4095 ? '0x' + v.toString(16) : JSON.stringify(v))).join(', ');
const listed = new Set(), sections = CATALOG.map(sec => ({...sec, cats:sec.cats.map(([cat, list]) => ({cat, list:list.map(x => typeof x === 'string' ? {n:x} : x).filter(x => names.includes(x.n))}))}));
sections.forEach(sec => sec.cats.forEach(c => c.list.forEach(x => listed.add(x.n))));
const rest = names.filter(n => !listed.has(n)); if (rest.length) sections.push({title:'기타', cats:[{cat:'', list:rest.map(n => ({n}))}]});
const entries = [];
sections.forEach((sec, si) => sec.cats.forEach(c => c.list.forEach(x => { const def = getProp(x.n), status = x.status || (def.unplaced ? 'new' : 'placed');
  (def.variants || [{}]).forEach(v => { const opts = v.opts || (x.n === 'car' ? {color:0xd9695c} : {}), obj = buildProp(x.n, opts), fp = new THREE.Box3().setFromObject(obj).getSize(new THREE.Vector3());
    entries.push({n:x.n, def, opts, obj, fp, si, sec:sec.title, cat:c.cat || sec.title, status, note:x.note, variant:!!v.label, label:def.label + (v.label ? ' · ' + v.label : ''), big:isBld(x.n) || Math.max(fp.x, fp.z) > 13}); }); })));
const COLS = 6, GAP = 15, items = [], fresh = e => e.def.isNewStyle;
let bldX = -120, row = -1, col = COLS, lastCat = null;
entries.forEach(e => {
  const {n, def, obj, fp, big} = e, padR = big ? Math.max(fp.x, fp.z) / 2 + 3 : Math.min(7, Math.max(4.2, Math.max(fp.x, fp.z) / 2 + 1));
  let x, z;
  if (big) { x = bldX + padR; z = -padR - 12; bldX += padR * 2 + 14; }
  else { const key = e.si + '/' + e.cat; if (key !== lastCat || col >= COLS) { row++; col = 0;
      if (key !== lastCat) { const t = pillSprite(e.cat, 'rgba(43,63,85,.86)', '#fff', 1.1); t.position.set(-(COLS / 2) * GAP - 6, 1.2, row * GAP); scene.add(t); lastCat = key; } }
    x = (col - (COLS - 1) / 2) * GAP; z = row * GAP; col++; }
  obj.position.set(x, 0, z); if (!obj.userData.info) obj.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); scene.add(obj);
  const pad = new THREE.Mesh(new THREE.CircleGeometry(padR, 56), new THREE.MeshLambertMaterial({color:def.groundPreview ? 0x3d4248 : fresh(e) ? 0xe6eef3 : 0xeceff2})); pad.rotation.x = -Math.PI / 2; pad.position.set(x, .01, z); pad.receiveShadow = true; scene.add(pad);
  const size = new THREE.Box3().setFromObject(obj).getSize(new THREE.Vector3());
  const tag = pillSprite(e.label, fresh(e) ? 'rgba(47,127,140,.92)' : 'rgba(255,255,255,.92)', fresh(e) ? '#fff' : '#2b3f55', .7); tag.position.set(x, size.y + 1, z); scene.add(tag);
  items.push({...e, x, z, size, tag});
});

// 목록: 큰 묶음(접고 펼 수 있음) → 분류 → 소품
const sel = {i:0}, lists = document.getElementById('lists');
sections.forEach((sec, si) => {
  const mine = items.map((it, i) => i).filter(i => items[i].si === si); if (!mine.length) return;
  const d = document.createElement('details'); d.className = 'sec'; d.open = !!sec.open;
  const sum = document.createElement('summary'), t = document.createElement('span'), cnt = document.createElement('small');
  t.textContent = sec.title; cnt.textContent = new Set(mine.map(i => items[i].n)).size + '종'; t.append(cnt); sum.append(t); d.append(sum);
  if (sec.note) { const p = document.createElement('p'); p.className = 'note'; p.textContent = sec.note; d.append(p); }
  let box = null, cur = null;
  mine.forEach(i => { const it = items[i];
    if (it.cat !== cur) { cur = it.cat; if (it.cat !== sec.title) { const h = document.createElement('h3'); h.className = 'cat'; h.textContent = it.cat; d.append(h); } box = document.createElement('div'); box.className = 'list'; d.append(box); }
    const b = document.createElement('button'), tx = document.createElement('span'); b.className = 'item'; tx.className = 'txt'; tx.textContent = it.label;
    if (it.note && !it.variant) { const nt = document.createElement('span'); nt.className = 'note'; nt.textContent = it.note; tx.append(nt); }
    b.append(tx);
    const badge = it.def.update ? ['움직임', ''] : STATUS[it.status].badge ? [STATUS[it.status].badge, it.status === 'idle' ? 'idle' : it.status === 'replaced' ? 'old' : ''] : null;
    if (badge) { const s = document.createElement('span'); s.className = 'badge ' + badge[1]; s.textContent = badge[0]; b.append(s); }
    b.onclick = () => select(i); it.btn = b; box.append(b); });
  lists.append(d);
});

// 카메라
const cam = {yaw:.6, pitch:.42, dist:12, tx:0, ty:1, tz:0, idle:0}, goal = {dist:12, tx:0, ty:1, tz:0};
function select(i){
  sel.i = i; const it = items[i];
  items.forEach((x, k) => { x.btn.setAttribute('aria-current', k === i ? 'true' : 'false'); x.tag.visible = k !== i; });
  const det = it.btn.closest('details'); if (det && !det.open) det.open = true;
  goal.tx = it.x; goal.tz = it.z; goal.ty = Math.max(.2, it.size.y * (it.big ? .45 : .25)); goal.dist = Math.max(4.5, Math.max(it.size.x, it.size.y, it.size.z) * (it.big ? 1.75 : 2.3) + 2.5);
  document.getElementById('name').textContent = it.label;
  const meta = document.getElementById('meta'); meta.textContent = '';
  [it.sec + (it.cat !== it.sec ? ' › ' + it.cat : ''), '폭 ' + it.size.x.toFixed(1) + ' · 깊이 ' + it.size.z.toFixed(1) + ' · 높이 ' + it.size.y.toFixed(1),
   it.def.colliders ? '충돌 영역 ' + it.def.colliders.length + '개' : isBld(it.n) ? '충돌 자동 등록' : '충돌 없음', it.def.update ? '애니메이션 있음' : '정지', STATUS[it.status].label].concat(it.note ? [it.note] : [])
    .concat(it.obj.userData.info ? ['삼각형 ' + it.obj.userData.info.tris.toLocaleString() + '개', '그리기 ' + it.obj.userData.info.draws + '회 · 재질 ' + it.obj.userData.info.materials + '개'] : [])
    .forEach(t => { const s = document.createElement('span'); s.textContent = t; meta.append(s); });
  document.getElementById('code').textContent = (it.def.usage || "W.place('" + it.n + "', {x: 300, z: 140, rot: 0});") + (it.variant ? '   // 이 모양: {' + fmt(it.opts) + '}' : '');
}
// 설명 카드 접기/펼치기. 좁은 화면(휴대폰)에서는 접힌 채로 시작하고, 고른 상태는 이 브라우저에 기억한다.
const card = document.getElementById('card'), fold = document.getElementById('fold');
function setOpen(open){
  card.dataset.open = open ? 'true' : 'false'; fold.setAttribute('aria-expanded', open ? 'true' : 'false');
  document.getElementById('fold-label').textContent = open ? '접기' : '자세히';
  try { localStorage.setItem('gallery-card-open', open ? '1' : '0'); } catch (err) {}
}
let saved = null; try { saved = localStorage.getItem('gallery-card-open'); } catch (err) {}
setOpen(saved === null ? !matchMedia('(max-width:720px)').matches : saved === '1');
fold.onclick = () => setOpen(card.dataset.open !== 'true');
document.getElementById('copy').onclick = async e => {
  const t = document.getElementById('code').textContent, btn = e.currentTarget;
  try { await navigator.clipboard.writeText(t); btn.textContent = '복사됨'; } catch (err) { const r = document.createRange(); r.selectNodeContents(document.getElementById('code')); getSelection().removeAllRanges(); getSelection().addRange(r); btn.textContent = '선택됨'; }
  setTimeout(() => { btn.textContent = '복사'; }, 1400);
};
let drag = null, pinch = 0; const ptr = new Map();
canvas.addEventListener('pointerdown', e => { ptr.set(e.pointerId, {x:e.clientX, y:e.clientY}); try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  if (ptr.size === 2) { const a = [...ptr.values()]; pinch = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); } cam.idle = 0; });
canvas.addEventListener('pointermove', e => { const p = ptr.get(e.pointerId); if (!p) return; const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; cam.idle = 0;
  if (ptr.size === 2 && pinch) { const a = [...ptr.values()], d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); goal.dist = Math.min(160, Math.max(2, goal.dist * pinch / d)); pinch = d; return; }
  cam.yaw -= dx * .007; cam.pitch = Math.min(1.3, Math.max(.05, cam.pitch + dy * .005)); });
const up = e => { ptr.delete(e.pointerId); if (ptr.size < 2) pinch = 0; };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', e => { goal.dist = Math.min(160, Math.max(2, goal.dist * (e.deltaY > 0 ? 1.1 : .9))); cam.idle = 0; e.preventDefault(); }, {passive:false});
canvas.addEventListener('keydown', e => { if (e.key === 'ArrowRight') select((sel.i + 1) % items.length); if (e.key === 'ArrowLeft') select((sel.i + items.length - 1) % items.length); });

function resize(){ const r = canvas.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(canvas); resize();
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; cam.idle += dt;
  if (cam.idle > 3 && !still) cam.yaw += dt * .25;
  const k = Math.min(1, dt * 4); ['tx','ty','tz','dist'].forEach(p => { cam[p] += (goal[p] - cam[p]) * k; });
  const cp = Math.cos(cam.pitch);
  camera.position.set(cam.tx + Math.sin(cam.yaw) * cp * cam.dist, cam.ty + Math.sin(cam.pitch) * cam.dist, cam.tz + Math.cos(cam.yaw) * cp * cam.dist);
  camera.lookAt(cam.tx, cam.ty, cam.tz);
  sun.target.position.set(cam.tx, 0, cam.tz); sun.position.set(cam.tx - 84, 94, cam.tz + 90);
  items.forEach(it => { if (it.def.update) it.def.update(it.obj, dt, now); });
  renderer.render(scene, camera);
}
select(0); requestAnimationFrame(frame);
window.__galleryReady = true;
</script>
</body>
</html>
