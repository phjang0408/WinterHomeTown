<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>겨울 동네</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: full-bleed 3D scene, HUD pinned to the four corners, one prompt at bottom center */
  --ink:#2b3f55; --ink-soft:#5d7088; --teal:#2f7f8c; --brick:#b5594a;
  --snow:#f3f7fa; --sand:#f4e3c6; --line:#cdd9e3;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#dde7ee;color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#scene.aim{cursor:crosshair}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.card{background:rgba(243,247,250,.92);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 6px 20px rgba(43,63,85,.12);backdrop-filter:blur(6px)}
.pill{background:rgba(243,247,250,.92);border:1px solid var(--line);border-radius:999px;padding:8px 14px;
  font-size:14px;line-height:1.2;white-space:nowrap}
#top{position:fixed;left:16px;top:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:calc(100% - 32px)}
#me-chip{display:flex;align-items:center;gap:8px}
#me-chip i{width:12px;height:12px;border-radius:50%;background:var(--teal);display:inline-block}
#me-chip b{font-family:var(--display);font-weight:400;font-size:16px}
#me-chip small{color:var(--ink-soft)}
#roster-btn b{font-family:var(--display);font-weight:400;color:var(--teal);font-variant-numeric:tabular-nums}
#net{color:var(--ink-soft)}
#mini{position:fixed;right:16px;top:16px;width:210px;height:auto;border-radius:10px;border:1px solid var(--line);
  box-shadow:0 6px 20px rgba(43,63,85,.12);cursor:zoom-in;background:var(--snow);transition:width .2s}
#mini.big{width:min(680px,calc(100% - 32px));cursor:zoom-out;z-index:5}
#help{position:fixed;left:16px;bottom:16px;font-size:13px;color:var(--ink-soft);line-height:1.6;padding:10px 14px}
#help b{color:var(--ink);font-weight:400;font-family:var(--display)}
#dock{position:fixed;right:16px;bottom:16px;display:flex;gap:8px}
#dock button{min-height:40px}
#prompt{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--teal);color:#fff;
  font-family:var(--display);font-size:18px;padding:12px 22px;border-radius:999px;
  box-shadow:0 8px 22px rgba(47,127,140,.35);max-width:calc(100% - 32px)}
#prompt kbd{font-family:var(--body);font-size:13px;background:rgba(255,255,255,.22);border-radius:6px;padding:2px 7px;margin-right:8px}
#game{position:fixed;left:50%;top:16px;transform:translateX(-50%);padding:10px 14px;display:flex;gap:14px;align-items:center;
  max-width:calc(100% - 32px);flex-wrap:wrap;justify-content:center}
#game h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0}
#game-stat{font-variant-numeric:tabular-nums;font-size:15px}
#game-quit{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
#gauge{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);width:min(420px,calc(100% - 48px));padding:12px 14px}
#gauge p{margin:0 0 8px;font-size:14px;text-align:center}
#track{position:relative;height:18px;border-radius:9px;background:#dfe7ee;overflow:hidden}
#zone{position:absolute;top:0;bottom:0;background:var(--sand);border-left:2px solid var(--brick);border-right:2px solid var(--brick)}
#needle{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;border-radius:3px;background:var(--ink)}
#slam{display:block;margin:10px auto 0;background:var(--brick);color:#fff;font-family:var(--display);font-size:17px;
  padding:10px 22px;border-radius:999px}
#flash{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);font-family:var(--display);font-size:44px;color:var(--brick);
  text-shadow:0 2px 0 #fff,0 0 18px rgba(255,255,255,.9);pointer-events:none;opacity:0}
#flash.go{animation:pop .9s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 32px));padding:22px;text-align:center;z-index:6}
.sheet h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 6px;text-wrap:balance}
.sheet p{margin:6px 0;line-height:1.6}
.sheet .big{font-family:var(--display);font-size:40px;color:var(--teal);margin:8px 0}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn{background:var(--teal);color:#fff;font-family:var(--display);font-size:17px;padding:11px 20px;border-radius:999px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
#roster{max-height:70%;overflow:auto;text-align:left}
#roster table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
#roster th{font-weight:400;color:var(--ink-soft);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
#roster th:first-child,#roster td:first-child{text-align:left}
#roster td{padding:6px;text-align:right;border-bottom:1px solid #e3eaf0}
#roster td i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
#intro{width:min(440px,calc(100% - 32px));padding:28px 26px}
#intro h1{font-family:var(--display);font-weight:400;font-size:44px;margin:0;letter-spacing:.02em}
#intro .sub{color:var(--ink-soft);margin:4px 0 16px}
#intro .name{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:12px;margin:14px 0 6px}
#intro .name b{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:var(--teal)}
#intro .name small{color:var(--ink-soft)}
#intro ul{list-style:none;padding:0;margin:14px 0 0;font-size:14px;color:var(--ink-soft);line-height:1.8}
[hidden]{display:none!important}
@media (max-width:640px){
  #help{display:none} #mini{width:120px} #net{display:none}
  #top{top:10px;left:10px} #mini{top:56px;right:10px}
  #game{top:56px} #prompt{bottom:70px}
}
@media (prefers-reduced-motion:reduce){#flash.go{animation-duration:.01s}}
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="겨울 동네 3D 화면"></canvas>
<img id="mapimg" src="map.jpg" alt="" hidden>

<div id="top" hidden>
  <div id="me-chip" class="pill"><i id="me-dot"></i><b id="me-name"></b><small>나</small></div>
  <button id="roster-btn" class="pill">지금 <b id="count">1</b>명 산책 중</button>
  <span id="net" class="pill">혼자 걷는 중</span>
</div>
<canvas id="mini" width="660" height="404" title="지도 크게 보기" hidden></canvas>

<div id="game" class="card" hidden>
  <h2 id="game-title"></h2><span id="game-stat"></span>
  <button id="game-quit">그만하기</button>
</div>
<div id="gauge" class="card" hidden>
  <p id="gauge-text"></p>
  <div id="track"><div id="zone"></div><div id="needle"></div></div>
  <button id="slam" hidden>내려치기</button>
</div>
<div id="flash" aria-live="polite"></div>
<button id="prompt" hidden></button>

<div id="help" class="card" hidden>
  <b>이동</b> WASD · 방향키 · 바닥 누르기<br>
  <b>상호작용</b> E &nbsp; <b>손 흔들기</b> 1 &nbsp; <b>확대</b> 휠
</div>
<div id="dock" hidden>
  <button id="wave" class="pill">손 흔들기</button>
  <button id="snd" class="pill" aria-pressed="true">소리 켬</button>
</div>

<section id="roster" class="sheet card" hidden>
  <h2>지금 동네 사람들</h2>
  <table><thead><tr><th>이름</th><th>과녁</th><th>딱지</th><th>눈사람</th></tr></thead><tbody id="roster-body"></tbody></table>
  <div class="row"><button class="btn ghost" id="roster-close">닫기</button></div>
</section>

<section id="result" class="sheet card" hidden>
  <h2 id="res-title"></h2>
  <div class="big" id="res-score"></div>
  <p id="res-line"></p>
  <div class="row"><button class="btn" id="res-again">다시 하기</button><button class="btn ghost" id="res-close">산책 계속하기</button></div>
</section>

<section id="intro" class="sheet card">
  <h1>겨울 동네</h1>
  <p class="sub">폐역에서 강변까지 이어지는 겨울 산책길</p>
  <p>말 없이 함께 걷는 동네입니다.<br>채팅은 없고, 서로의 발자국만 남습니다.</p>
  <div class="name"><small>오늘의 이름</small><b id="intro-name"></b></div>
  <div class="row">
    <button class="btn ghost" id="reroll">다른 이름</button>
    <button class="btn" id="enter">동네로 들어가기</button>
  </div>
  <ul>
    <li>운동장 눈덩이 과녁 · 문구점 앞 딱지치기 · 공원 눈사람 만들기</li>
    <li>벤치와 그네에 앉아 쉬어갈 수 있습니다</li>
  </ul>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const T = window.THREE;
const $ = id => document.getElementById(id);
const canvas = $('scene');
if (!T) { $('intro').innerHTML = '<h2>3D 엔진을 불러오지 못했습니다</h2><p>네트워크를 확인한 뒤 새로고침해 주세요.</p>'; return; }

/* ───────── 기본 값 ───────── */
const FONT_D = '"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const PI = Math.PI, TAU = PI * 2;
const MAP_W = 200, MAP_D = 122.5, SPEED = 7.5, RAD = 0.45, CAM_H = 42, CAM_B = 37, CAM_TAN = CAM_H / CAM_B;
const ADJ = ['포근한','조용한','느긋한','말랑한','따끈한','수줍은','졸린','소복한','반짝이는','다정한','동그란','나른한'];
const NOUN = ['눈송이','귤','붕어빵','목도리','호빵','고드름','털모자','군고구마','입김','손난로','발자국','장갑','코코아','눈토끼'];
const COLORS = [
  {j:0xd9695c,h:0xf4ecd8,css:'#d9695c'},{j:0x3f8a97,h:0xf2c66d,css:'#3f8a97'},
  {j:0xe2a84b,h:0x5b6f8c,css:'#e2a84b'},{j:0x6f86b8,h:0xf3d9d2,css:'#6f86b8'},
  {j:0x7fae8a,h:0xb5594a,css:'#7fae8a'},{j:0xc48bb0,h:0xfafafa,css:'#c48bb0'},
  {j:0x8a6f5a,h:0xe9b84e,css:'#8a6f5a'},{j:0x5a6b7d,h:0xd9695c,css:'#5a6b7d'}];
const SLOTS = [[98,55],[101.5,57.5],[98,61],[102,64],[105.5,55],[106,61],[73,59],[75,54.5],[75.5,64],[88,54.5],[87,64.5],[91.5,65]];
const BENCHES = [{x:81,z:27.7},{x:34.6,z:104.3},{x:138.2,z:104.3},{x:180.7,z:104.3}];
const SW = {z:57,top:3.3,L:2.5,seats:[37.2,39.8]};
const TG = {z:56,y:2.3,b:[160.5,167.3,174],A:[2.2,3.4,2.2],w:[.9,1.5,1.2],ph:[0,2,4],R:[1.25,1.0,1.25]};
const TK = {x:121.3,z:65.3};
const SNOW_SPOT = {x:90.5,z:61}, TB = 0.95, TH = 0.58;
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const rnd = n => Math.floor(Math.random() * n);
function lerpAngle(a,b,k){ const d = ((b - a + PI) % TAU + TAU) % TAU - PI; return a + d * k; }
function groundY(x,z){
  if (z >= 93) return -1.5;
  if (z > 90) return -1.5 * (z - 90) / 3;
  if (x > 65 && x < 97 && z > 25.7 && z < 30.4) return 0.6;
  return 0;
}

/* ───────── 렌더러 ───────── */
const renderer = new T.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene();
scene.background = new T.Color(0xdde7ee);
scene.fog = new T.Fog(0xdde7ee, 100, 260);
const camera = new T.PerspectiveCamera(28, 1, 1, 460);
scene.add(new T.HemisphereLight(0xffffff, 0xc3cfdd, 0.70));
const sun = new T.DirectionalLight(0xfff0dc, 0.40);
sun.position.set(40, 95, 105); sun.target.position.set(100, 0, 60); scene.add(sun, sun.target);
sun.castShadow = true;
const small = Math.min(window.innerWidth, window.innerHeight) < 700;
sun.shadow.mapSize.set(small ? 2048 : 4096, small ? 2048 : 4096);
Object.assign(sun.shadow.camera, {left:-120,right:120,top:95,bottom:-95,near:10,far:280});
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.04;
function resize(){
  const w = canvas.clientWidth || window.innerWidth, h = canvas.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

/* ───────── 만들기 도구 ───────── */
const world = new T.Group(); scene.add(world);
const matCache = {};
const M = c => matCache[c] || (matCache[c] = new T.MeshLambertMaterial({color:c}));
const rects = [], circles = [], fadeables = [];
function flat(x0,z0,x1,z1,c,y){
  const m = new T.Mesh(new T.PlaneGeometry(x1 - x0, z1 - z0), M(c));
  m.rotation.x = -PI / 2; m.position.set((x0 + x1) / 2, y === undefined ? 0.01 : y, (z0 + z1) / 2);
  m.receiveShadow = true; world.add(m); return m;
}
function box(x0,z0,x1,z1,h,mat,y0,parent){
  const m = new T.Mesh(new T.BoxGeometry(x1 - x0, h, z1 - z0), mat);
  m.position.set((x0 + x1) / 2, (y0 || 0) + h / 2, (z0 + z1) / 2);
  m.castShadow = m.receiveShadow = true; (parent || world).add(m); return m;
}
function mesh(geo, mat, x, y, z, parent){
  const m = new T.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; (parent || world).add(m); return m;
}
function rr(g,x,y,w,h,r){
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
let seed = 7; const srand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function facadeTex(w,h,o){
  const s = 32, c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
  const g = c.getContext('2d'), W = c.width, H = c.height;
  g.fillStyle = o.base; g.fillRect(0, 0, W, H);
  if (o.kind === 'shop') {
    g.fillStyle = '#fffaf0'; rr(g, s * .5, s * .3, W - s, s * 1.35, s * .3); g.fill();
    g.strokeStyle = 'rgba(60,70,90,.25)'; g.lineWidth = 2; g.stroke();
    g.fillStyle = '#34465c'; g.font = (s * .92) + 'px ' + FONT_D; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(o.label, W / 2, s * 1.02);
    const n = Math.max(6, Math.round(w / 0.9));
    for (let i = 0; i < n; i++) { g.fillStyle = i % 2 ? '#fbf4e6' : (o.awn || '#c9705f'); g.fillRect(i * W / n, s * 1.85, W / n + 1, s * .5); }
    const gy = s * 2.65, gh = H - gy - s * .4, dw = s * 1.3, dx = W / 2 - dw / 2;
    g.fillStyle = '#cfe1ea'; g.fillRect(s * .6, gy, dx - s, gh * .82); g.fillRect(dx + dw + s * .4, gy, W - (dx + dw + s * .4) - s * .6, gh * .82);
    g.fillStyle = 'rgba(255,236,170,.45)'; g.fillRect(s * .6, gy + gh * .45, dx - s, gh * .37); g.fillRect(dx + dw + s * .4, gy + gh * .45, W - (dx + dw + s * .4) - s * .6, gh * .37);
    g.fillStyle = '#8b6b56'; g.fillRect(dx, gy, dw, gh + s * .4);
    g.fillStyle = '#e9d9b8'; g.fillRect(dx + dw * .15, gy + s * .2, dw * .7, gh * .45);
  } else {
    const fl = Math.max(2, Math.round(h / 2.9)), cols = Math.max(2, Math.round(w / 2.5));
    const top = o.label ? s * 1.9 : s * .9, cw = (W - s * 1.2) / cols, rh = (H - top - s * .6) / fl;
    for (let r = 0; r < fl; r++) for (let q = 0; q < cols; q++) {
      const x = s * .6 + q * cw + cw * .18, y = top + r * rh + rh * .18;
      g.fillStyle = srand() < .22 ? '#f7e2a6' : '#b9cadb'; g.fillRect(x, y, cw * .64, rh * .55);
      g.fillStyle = 'rgba(255,255,255,.75)'; g.fillRect(x - 2, y + rh * .55, cw * .64 + 4, rh * .08);
    }
    if (o.label) { g.fillStyle = '#4b607a'; g.font = (s * 1.15) + 'px ' + FONT_D; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText(o.label, s * .7, s * 1.02); }
  }
  return new T.CanvasTexture(c);
}
function building(x0,z0,x1,z1,h,o){
  const side = new T.MeshLambertMaterial({color:o.base});
  const front = new T.MeshLambertMaterial({map:facadeTex(x1 - x0, h, o)});
  const roof = new T.MeshLambertMaterial({color:0xf8fbfd});
  const mats = [side, side, roof, side, front, side], list = [side, front, roof];
  if (o.westFace) { mats[1] = new T.MeshLambertMaterial({map:facadeTex(z1 - z0, h, {base:o.base})}); list.push(mats[1]); }
  box(x0, z0, x1, z1, h, mats);
  fadeables.push({x0,z0,x1,z1,h,mats:list,op:1});
  rects.push([x0,z0,x1,z1]);
}
function pillSprite(text, bg, fg, hgt){
  const c = document.createElement('canvas'), g = c.getContext('2d'), fs = 34;
  g.font = fs + 'px ' + FONT_D; const tw = Math.ceil(g.measureText(text).width);
  c.width = tw + 36; c.height = 54;
  g.font = fs + 'px ' + FONT_D; g.fillStyle = bg; rr(g, 1, 1, c.width - 2, c.height - 2, 26); g.fill();
  g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, c.width / 2, c.height / 2 + 2);
  const sp = new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c), depthTest:false, transparent:true}));
  sp.scale.set(c.width / c.height * hgt, hgt, 1); sp.renderOrder = 10; return sp;
}

/* ───────── 동네 만들기 ───────── */
const swingPivots = [], targets = [], spotLabels = [];
let bus, busPath, tk, tkThrown, flag, fpMesh, snowPts, tapRing;
function buildWorld(){
  // 땅: 강변 쪽으로 한 단 낮아지는 지형
  const gg = new T.BufferGeometry(), zs = [-70, 90, 93, 200], ys = [0, 0, -1.5, -1.5], v = [];
  zs.forEach((z, i) => v.push(-80, ys[i], z, 280, ys[i], z));
  gg.setAttribute('position', new T.Float32BufferAttribute(v, 3));
  gg.setIndex([0,2,1, 1,2,3, 2,4,3, 3,4,5, 4,6,5, 5,6,7]); gg.computeVertexNormals();
  const ground = new T.Mesh(gg, M(0xf1f5f8)); ground.receiveShadow = true; world.add(ground);

  // 구역 바닥

function updateRemotes(dt, now){

    R.r = lerpAngle(R.r, R.tr, k); const moved = Math.hypot(R.x - ox, R.z - oz);
    placeChar(R, R.char, dt, moved, now);
    if (R.st !== 1 && R.st !== 2 && moved > .002) trackPrints(R, moved, now);
    if (R.ball > 0 && R.st === 5) { if (!R.ballM) { R.ballM = mesh(GEO.ball, M(0xfbfdfe), 0, 0, 0, scene); } rollBall(R.ballM, R, R.ball, moved); R.ballM.visible = true; }
    else if (R.ballM) R.ballM.visible = false;
  });
}
function swingAngle(i, now){ return Math.sin(now / 1000 * 2.3 + i * 1.7) * .55; }
function placeChar(w, ch, dt, moved, now){
  if (w.st === 2) { const i = w === me ? me.seat : (Math.abs(w.x - SW.seats[0]) < Math.abs(w.x - SW.seats[1]) ? 0 : 1), th = swingAngle(i, now);
    ch.position.set(SW.seats[i], SW.top - SW.L * Math.cos(th) - .5, SW.z - SW.L * Math.sin(th)); ch.rotation.set(-th * .7, 0, 0); swingBusy[i] = true; }
  else { const gy = groundY(w.x, w.z) + (w.st === 1 ? 0 : 0); w.y = w.y === undefined ? gy : w.y + (gy - w.y) * Math.min(1, dt * 14);
    ch.position.set(w.x, w.y, w.z); ch.rotation.set(0, w.r, 0); }

const swingBusy = [false, false];
function rollBall(m, w, r, moved){

const rollAxis = new T.Vector3();

/* ───────── 카메라 ───────── */
const camPos = new T.Vector3(100, 92, 168), camTgt = new T.Vector3(100, 0, 58), cp = new T.Vector3(), tp = new T.Vector3();
function updateCamera(dt, now){
  if (mode === 'intro') { const a = reduceMotion ? 0 : now * .00006; cp.set(100 + Math.sin(a) * 40, 92, 168); tp.set(100 + Math.sin(a) * 14, 0, 58); }
  else if (mode === 'target') { cp.set(167.3, 8.5, 88); tp.set(167.3, 2.3, 56); }
  else if (mode === 'ttakji') { cp.set(120.7, 12.5, 79); tp.set(120.7, .6, 66.3); }
  else { tp.set(me.x, me.y + 1, me.z); cp.set(me.x, me.y + 1 + CAM_H * zoom, me.z + CAM_B * zoom); }

function updateFade(dt){

      : (mode === 'ttakji' && b.z0 > 69 && b.x1 > 104 && b.x0 < 138);

    b.mats.forEach(m => { m.opacity = b.op; m.transparent = b.op < .99; }); }
}

/* ───────── 입력 ───────── */
const KEYMAP = {KeyW:'up',ArrowUp:'up',KeyS:'down',ArrowDown:'down',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right'};
window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'BUTTON' && (e.code === 'Enter' || e.code === 'Space')) return;
  if (mode === 'intro') { if (e.code === 'Enter') enter(); return; }
  if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = true; e.preventDefault(); }
  else if (e.code === 'KeyE' || e.code === 'Space' || e.code === 'Enter') { if (!e.repeat && $('result').hidden && $('roster').hidden) doAction(); if (e.code === 'Space') e.preventDefault(); }
  else if (e.code === 'Digit1') wave();
  else if (e.code === 'Escape') { if (!$('result').hidden) $('result').hidden = true; else if (!$('roster').hidden) $('roster').hidden = true; else if (game) quitGame(); }
});
window.addEventListener('keyup', e => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const ray = new T.Raycaster(), ndc = new T.Vector2(), ptrs = new Map(); let pinch = 0;
function setRay(e){ const r = canvas.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height * 2 - 1)); ray.setFromCamera(ndc, camera); return ray.ray; }
canvas.addEventListener('pointerdown', e => { ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY, sx:e.clientX, sy:e.clientY, t:performance.now()});
  if (ptrs.size === 2) { const a = Array.from(ptrs.values()); pinch = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); } });
canvas.addEventListener('pointermove', e => { const p = ptrs.get(e.pointerId); if (!p) return; p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 2 && pinch) { const a = Array.from(ptrs.values()), d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); zoom = clamp(zoom * pinch / d, .5, 1.7); pinch = d; } });

canvas.addEventListener('pointercancel', ptrEnd);
canvas.addEventListener('pointerup', e => {
  const p = ptrEnd(e); if (!p || ptrs.size || Math.hypot(e.clientX - p.sx, e.clientY - p.sy) > 10 || performance.now() - p.t > 600) return;
  const r = setRay(e), o = r.origin, d = r.direction;
  if (mode === 'target') { if (d.z > -1e-4) return; const t = (TG.z - o.z) / d.z; throwAt(clamp(o.x + d.x * t, 152, 183), clamp(o.y + d.y * t, .3, 6.5)); return; }
  if (mode !== 'walk' && mode !== 'snow') return; if (d.y > -1e-4) return;
  let t = -o.y / d.y, x = o.x + d.x * t, z = o.z + d.z * t; if (z > 91.5) { t = (-1.5 - o.y) / d.y; x = o.x + d.x * t; z = o.z + d.z * t; }
  tapTarget = {x:clamp(x, 7.6, 192.4), z:clamp(z, 17.1, 107.2)}; stuck = 0;
});
canvas.addEventListener('wheel', e => { zoom = clamp(zoom * (e.deltaY > 0 ? 1.1 : .9), .5, 1.7); e.preventDefault(); }, {passive:false});
function wave(){ if (mode === 'intro' || me.st === 2) return; me.em = [me.em[0] + 1, 1]; emote(me.char, 1); sfx(620, 760, .1); }

/* ───────── HUD ───────── */
function fillRoster(){
  const rows = [{name:nameOf(me.a, me.n) + ' (나)', c:COLORS[me.ci].css, sc:me.sc}];
  remotes.forEach(R => rows.push({name:nameOf(R.a, R.n), c:COLORS[R.ci].css, sc:R.sc}));
  const tb = $('roster-body'); tb.textContent = '';
  rows.forEach(r => { const tr = document.createElement('tr'), td = document.createElement('td'), dot = document.createElement('i');
    dot.style.background = r.c; td.append(dot, r.name); tr.append(td);
    [r.sc[0] ? r.sc[0] + '점' : '-', r.sc[1] ? r.sc[1] + '장' : '-', r.sc[2] ? r.sc[2] + '점' : '-'].forEach(t => { const c = document.createElement('td'); c.textContent = t; tr.append(c); });
    tb.append(tr); });
}
$('roster-btn').onclick = () => { fillRoster(); $('roster').hidden = false; };

const mini = $('mini'), mg = mini.getContext('2d'), mapImg = $('mapimg'); let miniTick = 0;

  remotes.forEach(R => dot(R.x, R.z, COLORS[R.ci].css, 8)); dot(me.x, me.z, '#2f7f8c', 12);

/* ───────── 메인 루프 ───────── */
let last = performance.now();
function frame(now){

  swingBusy[0] = swingBusy[1] = false;

  if (mode === 'snow') { ballR = Math.min(1.5, ballR + moved * .014); if (!me.ball) me.ball = mesh(GEO.ball, M(0xfbfdfe), 0, 0, 0, scene);
    me.ball.visible = true; rollBall(me.ball, me, ballR, moved); $('needle').style.left = ballR / 1.5 * 100 + '%'; }

  // 과녁

}

/* ───────── 시작 ───────── */

})();
